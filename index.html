<style>
:root{--page:#e9dcc4;--surface:#fdf6ea;--soft:#f4ecdc;--tile:#efe2ca;--ink:#2e2a24;--muted:#5a4e3c;--line:#e2d1b1;--track:#d4c09c;--olive:#4f6b3a;--terra:#b5562f;--chip:#dccbab;--ok:#4f6b3a;--ok-bg:#e3ecd9;--bad:#b5562f;--bad-bg:#f6e0d5}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font-family:Rubik,system-ui,sans-serif;line-height:1.5;font-size:17px}
bdi,.heb,.pasuk p,[lang=he]{font-family:"David Libre","Frank Ruhl Libre",serif}
bdi{font-size:1.06em}
header{padding:16px 16px 10px;display:flex;flex-direction:column;gap:10px;max-width:760px;margin:0 auto}
.hrow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ttl{display:flex;align-items:center;gap:10px}
.logo{flex:0 0 46px;height:46px;border-radius:14px;background:var(--terra);display:flex;align-items:center;justify-content:center}
.heb{display:block;color:var(--terra);font-size:17px;line-height:1.2}
h1{font-size:22px;font-weight:700;margin:0;line-height:1.15}
.langs{display:flex;gap:3px;background:var(--chip);border-radius:14px;padding:3px}
.langs button{all:unset;cursor:pointer;font-size:14px;font-weight:600;color:var(--muted);border-radius:11px;padding:7px 11px;min-width:22px;text-align:center}
.langs button.on{background:var(--surface);color:var(--ink)}
.weekbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.weekbar select{cursor:pointer;font:inherit;font-size:16px;font-weight:600;padding:8px 14px;border-radius:999px;border:0;background:var(--surface);color:var(--ink);max-width:240px}
.cur{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fdf6ea;background:var(--olive);border-radius:999px;padding:5px 10px}
.sub{margin:0;color:var(--muted);font-size:15px}
body.quizmode .sub{display:none}
nav{position:fixed;inset-inline:0;bottom:0;z-index:8;background:var(--page);border-top:1px solid var(--track);display:flex;justify-content:center;padding:6px 6px calc(10px + env(safe-area-inset-bottom))}
nav .in{display:flex;width:100%;max-width:560px}
nav button{all:unset;cursor:pointer;flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:13px;font-weight:500;padding:4px 0;min-height:52px}
nav button .ico{border-radius:999px;padding:4px 14px;display:flex}
nav button .lb,.knav button .lb{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px;box-sizing:border-box}
@media (max-width:400px){nav button{font-size:12px}nav button .ico{padding:4px 10px}.knav button{font-size:13px}.knav button .ico{padding:5px 12px}}
@media (max-width:340px){nav button,.knav button{font-size:11px;letter-spacing:-.01em}.knav button .lb{padding:0}.knav,nav{padding-left:2px;padding-right:2px}.knav button{font-size:10.5px}nav button .ico,.knav button .ico{padding:4px 8px}}
nav button svg{width:22px;height:22px;stroke:currentColor}
nav button.on{color:var(--terra);font-weight:700}
nav button.on .ico{background:var(--olive);color:#fdf6ea}
.score{max-width:760px;margin:0 auto;padding:0 16px 8px;display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;color:var(--muted)}
.score .pts{background:var(--soft);color:var(--olive);border-radius:999px;padding:3px 10px;font-weight:700}
.score .pts b{font-weight:700}
.bar{height:12px;background:var(--track);flex:1;border-radius:6px;position:relative;display:flex;cursor:pointer}
.bar i{display:block;height:100%;transition:width .4s ease}.bar i.g{background:var(--olive);border-start-start-radius:6px;border-end-start-radius:6px}.bar i.r{background:var(--terra)}
.bar .mk{position:absolute;top:-3px;width:4px;height:18px;border-radius:2px;background:var(--ink);transition:inset-inline-start .3s ease;box-shadow:0 0 0 2px var(--page)}
main{max-width:760px;margin:0 auto;padding:6px 14px calc(var(--navh,110px) + 32px)}
.view{display:none}.view.on{display:block}
.card{background:var(--surface);border-radius:22px;padding:18px;margin:0 0 14px}
.top{display:flex;gap:12px;align-items:flex-start}
.art{flex:0 0 44px;height:44px;border-radius:12px;background:var(--terra);display:flex;align-items:center;justify-content:center}
.art svg{width:30px;height:30px}
.art svg *{stroke:#fdf6ea!important}.art svg [fill="#f3dfb0"]{fill:#fdf6ea!important}
.num{font-size:14px;font-weight:600;color:var(--muted)}
.q{font-size:24px;font-weight:600;margin:0;line-height:1.28}
.pasuk{margin-top:12px;padding:10px 14px;background:var(--soft);border-radius:16px}
.pasuk p{font-size:22px;line-height:1.55;margin:0;text-align:right;color:var(--muted)}
.pasuk .ref{display:block;font-size:13px;color:var(--muted);text-align:right;margin:0 0 4px;opacity:.8}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.opts.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.opts button{all:unset;cursor:pointer;background:var(--tile);border-radius:18px;padding:14px;font-size:17px;line-height:1.32;font-weight:500;display:flex;gap:10px;align-items:flex-start;border:2px solid transparent}
.opts.grid2 button{flex-direction:column;gap:4px;min-height:96px}
.opts button .l{font-weight:700;color:var(--terra);font-size:19px;line-height:1.2}
@media (hover:hover) and (pointer:fine){.opts button:hover{border-color:var(--track)}}
.opts button.right{background:var(--ok-bg);border-color:var(--ok);color:#2c4220}
.opts button.wrong{background:var(--bad-bg);border-color:var(--bad);color:#6b2c14}
.opts button[disabled]{cursor:default}
.ans{display:none;margin-top:12px;padding:12px 14px;background:var(--soft);border-radius:16px;font-size:16px}
.ans.show{display:block}
.ans .src,.src{display:block;margin-top:8px;font-size:13.5px;color:var(--muted)}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;background:var(--olive);color:#fdf6ea;padding:13px 22px;border-radius:18px;font-weight:600;font-size:17px;min-height:26px}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn[disabled]{opacity:.4;cursor:default}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border-radius:18px;padding:14px 16px}
.stat .k{font-size:13px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-size:36px;font-weight:700;line-height:1.1}
.stat .s{font-size:14px;color:var(--muted)}
.panel{background:var(--surface);border-radius:18px;padding:6px 16px 6px}
h2.sec{font-size:21px;font-weight:700;margin:10px 0 4px}
.wk{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px 10px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}.wk .track{grid-column:1/-1}
.wk:last-child{border-bottom:0}
.wk .nm{font-weight:600;font-size:16px}
.wk .track{flex:1;height:12px;background:var(--track);border-radius:6px;overflow:hidden;position:relative}
.wk .track i{position:absolute;inset-block:0;inset-inline-start:0;background:var(--olive)}
.wk .track u{position:absolute;inset-block:0;inset-inline-start:0;background:var(--terra);opacity:.85}
.wk .pt{text-align:end;font-variant-numeric:tabular-nums;font-size:15px;color:var(--muted)}
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{all:unset;cursor:pointer;font-size:15px;font-weight:600;padding:9px 16px;border-radius:999px;background:var(--surface)}
.tabs button.on{background:var(--olive);color:#fdf6ea}
table.lb{width:100%;border-collapse:collapse;background:var(--surface);border-radius:18px;overflow:hidden}
.lb td,.lb th{padding:12px 14px;text-align:start;border-bottom:1px solid var(--line);font-size:17px}
.lb tr:last-child td{border-bottom:0}
.lb th{font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
.lb td.n,.lb th.n{text-align:end;font-variant-numeric:tabular-nums}
.lb tr.me td{background:var(--soft);font-weight:700}
.medal{display:inline-block;width:30px;height:30px;border-radius:50%;text-align:center;line-height:30px;font-size:14px;font-weight:700;background:var(--track);color:#1b1b1b}
.m1{background:#e8c25a}.m2{background:#cfd4dc}.m3{background:#d9a27a}
.note{font-size:14px;color:var(--muted);background:var(--soft);border-radius:14px;padding:10px 14px;margin:0 0 12px}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.prtools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
#printSheet .ans{display:block}#printSheet .q{font-size:19px}#printSheet .card{padding:14px}
.modal{position:fixed;inset:0;background:rgba(46,42,36,.5);display:none;align-items:center;justify-content:center;z-index:20}
.modal>div{background:var(--surface);border-radius:22px;padding:22px;max-width:320px;text-align:center}
.modal button{margin:12px 4px 0}
.hact{display:flex;gap:6px;align-items:center}
.gear{all:unset;cursor:pointer;width:40px;height:40px;border-radius:12px;background:var(--chip);color:var(--ink);display:flex;align-items:center;justify-content:center}
.onb{background:var(--surface);border-radius:26px;padding:24px 22px;width:min(360px,90vw);display:flex;flex-direction:column;gap:10px;text-align:start}
.onb h2{margin:4px 0 6px;font-size:26px}
.onb label,.onb .lbl{font-weight:600;font-size:16px}
.onb input{font:inherit;font-size:18px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--ink)}
.onb input:focus{outline:none;border-color:var(--olive)}
.onb .hint{margin:-4px 0 4px;font-size:14px;color:var(--muted)}
.olangs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.olangs button{all:unset;cursor:pointer;text-align:center;padding:12px 6px;border-radius:14px;background:var(--tile);font-weight:600;font-size:16px;border:2px solid transparent}
.olangs button.on{border-color:var(--olive);background:var(--ok-bg)}
.onb{position:relative;max-height:90vh;max-height:calc(100dvh - 32px);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}.onb>*{flex-shrink:0}#onb{z-index:40;padding:16px 0}.onb .btn{margin-top:8px;justify-content:center}.oX{all:unset;cursor:pointer;position:absolute;top:10px;inset-inline-end:12px;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--muted)}@media (hover:hover) and (pointer:fine){.oX:hover{background:var(--soft)}}
.logo.big{width:60px;height:60px;border-radius:18px;flex:none}
/* flashcard */
.fc{perspective:1400px;position:relative}
.face{position:relative;background:var(--surface);border-radius:28px;padding:20px 18px}
.face.back{background:#fffaf0}
.fc.turn-out .face{transition:transform .17s ease-in;transform:rotateY(90deg)}
.fc.turn-in .face{animation:turnIn .2s ease-out}
@keyframes turnIn{from{transform:rotateY(-90deg)}to{transform:none}}
.lvb{display:inline-block;font-size:12.5px;font-weight:700;letter-spacing:.04em;border-radius:999px;padding:3px 10px}
.fhead .lvb{margin-inline-start:auto}
.lvb.l1{background:#e3ecd9;color:#3b5229}.lvb.l2{background:#f4e3c3;color:#7a5512}.lvb.l3{background:#f6dccf;color:#8f3a17}
.unlock{background:var(--olive);color:#fdf6ea;border-radius:14px;padding:10px 14px;font-weight:700;margin-bottom:10px;text-align:center}
.fhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.art.sm{flex:0 0 40px;height:40px;border-radius:12px}.art.sm svg{width:26px;height:26px}
.face .q{margin:0 0 4px}
.link{all:unset;cursor:pointer;display:block;margin:14px auto 0;color:var(--olive);font-weight:600;font-size:15px;text-decoration:underline;text-align:center}
.verdict{font-size:24px;font-weight:700;display:block;margin-bottom:6px}
.verdict.vok{color:var(--ok)}.verdict.vbad{color:var(--bad)}
.corr{margin:6px 0 12px;padding:12px 14px;border-radius:16px;background:var(--ok-bg);border:2px solid var(--ok);font-weight:600;color:#2c4220;font-size:17px}
.corr .l{margin-inline-end:8px;color:var(--terra)}
.expl{font-size:17px;line-height:1.6}
.arr{all:unset;cursor:pointer;width:38px;height:38px;border-radius:12px;background:var(--surface);color:var(--ink);font-size:24px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:0 0 38px}.arr[disabled]{opacity:.35;cursor:default}[dir=rtl] .arr svg{transform:scaleX(-1)}
.backbtns{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px}.backbtns .link{margin:0}
.fcnav{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:10px}
.fcnav .pos{direction:ltr;unicode-bidi:isolate;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.endcard{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:var(--olive);color:#fdf6ea}
.endbig{font-size:60px;font-weight:700;line-height:1}
.endpts{font-size:20px;margin:6px 0}.endcard p{max-width:340px;font-size:17px}
.endbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.endcard .btn{background:#fdf6ea;color:var(--olive)}.endcard .btn.ghost{background:none;color:#fdf6ea;border:1.5px solid rgba(253,246,234,.5)}
.fc.in-next{animation:inN .3s ease}.fc.in-prev{animation:inP .3s ease}
@keyframes inN{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes inP{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
[dir=rtl] .fc.in-next{animation-name:inP}[dir=rtl] .fc.in-prev{animation-name:inN}
@media (max-width:440px){h1{font-size:19px}.ttl .logo{display:none}.langs button{padding:7px 9px}.face .q{font-size:21px}.pasuk p{font-size:19px}.opts button{font-size:16px;padding:11px 12px}.opts{gap:8px;margin-top:10px}.face{padding:16px 14px}header{padding:12px 14px 8px;gap:8px}}
.score .pts,#an{direction:ltr;unicode-bidi:isolate}
@media (max-width:380px){.lb td,.lb th{padding:10px 7px;font-size:15px}.lb th{font-size:11px;letter-spacing:0}.medal{width:26px;height:26px;line-height:26px;font-size:12.5px}table.lb{table-layout:fixed}.lb th:first-child,.lb td:first-child{width:38px}.lb th.n,.lb td.n{width:64px}.lb td.nm{overflow-wrap:anywhere}}
@media (max-width:360px){.opts.grid2{grid-template-columns:1fr}.opts.grid2 button{min-height:0;flex-direction:row}}
@media print{header,nav,.score,.prtools,.note,#v-quiz,#v-dash,#v-lb{display:none!important}body{background:#fff}main{max-width:none;padding:0}#v-print{display:block!important}}
/* ---------- welcome (neutral) / settings (age theme) ---------- */




#onb.first .onb input:focus{border-color:#111827}



#onb.first .link{color:#374151}
/* settings: adult (Jerusalem stone) */
#onb .oages button{background:var(--tile);color:var(--ink);border:2px solid transparent}
#onb .oages button.on{border-color:var(--olive);background:var(--ok-bg)}
/* settings: kids (design A) */
#onb.kid{background:rgba(43,29,14,.45)}
#onb.kid .onb{background:#fff;color:#2b1d0e;font-family:"Baloo 2","Varela Round",Rubik,sans-serif;border-radius:30px}
#onb.kid .onb h2{font-weight:800}
#onb.kid .onb .logo{background:#0f766e;overflow:hidden}
#onb.kid .onb input{border-color:#e6cf9f;color:#2b1d0e;font-weight:700}#onb.kid .onb input:focus{border-color:#c2410c}
#onb.kid .onb .hint{color:#5c4630}
#onb.kid .olangs button,#onb.kid .oages button{background:#fff4dc;color:#2b1d0e;border:2px solid #e6cf9f;font-weight:800}
#onb.kid .olangs button.on,#onb.kid .oages button.on{background:#ffe1c7;border-color:#c2410c;color:#9a3412}
#onb.kid .onb .btn{background:#c2410c;color:#fff;border-radius:22px;font-weight:800;font-size:20px;box-shadow:0 5px 0 rgba(0,0,0,.18)}
#onb.kid .oX{color:#5c4630}#onb.kid .link{color:#5c4630}
.onames{display:grid;grid-template-columns:1fr 1fr;gap:8px}.onames input{min-width:0}#oUser{margin:-2px 0 0;font-weight:600}#oUser:empty{display:none}
.olangs.osnd{grid-template-columns:repeat(2,minmax(0,1fr))}
/* profile / welcome as a full page */
#onb{padding:0!important;align-items:stretch;justify-content:stretch}
#onb .onb{width:100%;max-width:none;height:100%;height:100dvh;max-height:none;border-radius:0!important;box-shadow:none!important;box-sizing:border-box;
  padding:calc(18px + env(safe-area-inset-top)) max(20px,calc((100% - 520px)/2)) calc(16px + env(safe-area-inset-bottom));gap:12px}
#onb .onb .oX{top:calc(10px + env(safe-area-inset-top));inset-inline-end:max(12px,calc((100% - 520px)/2 - 8px))}

.oages{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.oages button{all:unset;cursor:pointer;text-align:center;padding:10px 6px;border-radius:14px;font-weight:700;font-size:16px;line-height:1.2;display:flex;flex-direction:column;align-items:center;gap:2px}.oai{font-size:26px;line-height:1}
.oages.need{animation:shake .35s}.oneed{color:#b91c1c!important;font-weight:600}

/* ---------- kids mode (design A, high contrast) ---------- */
body.kids{--k-page:#fff4dc;--k-surf:#fff;--k-ink:#2b1d0e;--k-muted:#5c4630;--k-line:#e6cf9f;--k-acc:#c2410c;--k-teal:#0f766e;--k-purple:#6d28d9;background:var(--k-page);color:var(--k-ink);font-family:"Baloo 2","Varela Round",Rubik,sans-serif}
html:has(body.kids){background:#fff4dc}
body.kids>header,body.kids>#scorebar,body.kids>main,body.kids>nav{display:none!important}
#kids{display:none;max-width:560px;margin:0 auto;padding:14px 14px calc(118px + env(safe-area-inset-bottom))}
body.kids #kids{display:block}
.ktop{display:flex;align-items:center;justify-content:space-between;gap:8px}
.kme{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;min-height:48px}
.kav{width:48px;height:48px;border-radius:50%;background:var(--k-teal);display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}
.khi{font-weight:800;font-size:21px;line-height:1.1}
.kstar{display:flex;align-items:center;gap:6px;background:var(--k-acc);color:#fff;border-radius:999px;padding:6px 14px;font-weight:800;font-size:20px;flex:none}
.kweek{margin:10px 0 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.kweek select{font:inherit;font-weight:700;font-size:17px;color:var(--k-ink);background:#fff;border:2px solid var(--k-line);border-radius:999px;padding:6px 14px;min-height:42px}
.kpath{display:flex;gap:5px;margin:12px 0 6px}.kpath i{flex:1;height:14px;border-radius:7px;background:var(--k-line)}
.kpath i.ok{background:var(--k-purple)}.kpath i.no{background:#9f8a6a}.kpath i.cur{background:var(--k-acc)}
.kqn{font-weight:700;font-size:16px;color:var(--k-muted)}
.kcard{background:var(--k-surf);border-radius:28px;padding:14px;box-shadow:0 6px 0 rgba(0,0,0,.07);display:flex;flex-direction:column;gap:10px;margin-top:8px}
.kscene{border-radius:20px;overflow:hidden;line-height:0}.kscene svg{width:100%;height:auto;display:block}
.kq{margin:0;font-weight:800;font-size:23px;line-height:1.22}

async function saveBlob(blob,fn){try{const dl=window.claude&&await window.claude.use("downloads");if(dl){await dl.save({filename:fn,data:blob});return true}}catch(e){if(e&&e.code==="declined")return true}
  try{const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);return true}catch(e){return false}}
async function downloadSheet(w,lang,kind,htmlFallback,btn){const fn=`${(w.name.en||w.id).replace(/[^\w-]+/g,"-")}-${lang}-${{q:"questions",a:"answers",kq:"kids",ka:"kids-answers"}[kind]}.pdf`;
  const old=btn&&btn.textContent;if(btn){btn.disabled=true;btn.textContent="…"}
  try{const r=await fetch(`weeks/pdf/${w.id}-${lang}-${kind}.pdf`);if(r.ok){const b=await r.blob();if(b.size>500){await saveBlob(new Blob([b],{type:"application/pdf"}),fn);return true}}}catch(e){}

  return saveBlob(new Blob([htmlFallback()],{type:"text/html"}),fn.replace(/\.pdf$/,".html"))}
