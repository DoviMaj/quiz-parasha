<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Journey through the Torah</title><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="games.css?v=1795600001">
<style>
#map{position:fixed;inset:0;overflow-y:auto;background:#f6f1e7;z-index:10;-webkit-overflow-scrolling:touch;font-family:Rubik,system-ui,sans-serif}
#map .top{position:sticky;top:0;z-index:2;background:#fffcf6;border-bottom:1px solid #e2d8c5;padding:max(16px,env(safe-area-inset-top)) 16px 14px;display:flex;align-items:center;gap:8px}
#map h1{font-family:"Baloo 2",sans-serif;font-size:28px;font-weight:800;margin:0;flex:1;line-height:1}#map h1 small{display:block;font:400 13px Rubik,system-ui,sans-serif;color:#5a4e3c;margin-top:2px}
#map .x{all:unset;cursor:pointer;width:44px;height:44px;border-radius:14px;border:1px solid #e2d8c5;background:#fff;display:flex;align-items:center;justify-content:center;color:#2e2a24;box-sizing:border-box}
.path{position:relative;max-width:460px;margin:0 auto;padding:16px 16px 60px;display:flex;flex-direction:column;gap:16px}
.stt{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.stt div{background:#ece5d6;border-radius:12px;padding:8px 10px;display:flex;flex-direction:column}.stt b{font:800 20px/1.2 "Baloo 2",sans-serif}.stt span{font-size:12px;color:#5a4e3c}
.wk{background:#2c5a8a;color:#fff;border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:4px}.wk .k{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.92}.wk b{font:800 26px/1.1 "Baloo 2",sans-serif}.wk p{margin:0;font-size:14px;line-height:1.4}
.wk .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.gq{all:unset;cursor:pointer;box-sizing:border-box;background:#fffcf6;color:#2e2a24;border-radius:14px;min-height:44px;padding:0 16px;display:flex;align-items:center;gap:8px;font:600 15px Rubik,system-ui,sans-serif}.gq.pl{background:transparent;color:#fff;border:1.5px solid #fff}
[dir=rtl] .gq svg{transform:scaleX(-1)}
.book{margin:4px 4px 0;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#2c5a8a}
.line{position:relative;display:flex;flex-direction:column;gap:10px}.line:before{content:"";position:absolute;inset-inline-start:21px;top:22px;bottom:22px;width:3px;background:#cfc3ac;border-radius:2px}
.rw{position:relative;display:flex;align-items:center;gap:12px}
.dot{position:relative;z-index:1;width:44px;height:44px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font:800 18px "Baloo 2",sans-serif;box-sizing:border-box;background:#2c5a8a;color:#fff}
.rw.done .dot{background:#4f6b3a}.rw.quiz .dot{background:#fffcf6;color:#2c5a8a;border:3px solid #2c5a8a}.rw.lock .dot,.rw.soon .dot{background:#ece5d6;color:#5a4e3c}
.rw.now .dot{box-shadow:0 0 0 4px #f6f1e7,0 0 0 6px #2c5a8a}
.node{all:unset;box-sizing:border-box;cursor:pointer;flex:1;min-width:0;min-height:60px;border-radius:16px;padding:10px 14px;background:#fff;border:1px solid #e2d8c5;display:flex;align-items:center;justify-content:space-between;gap:10px}
.node.now{border:2px solid #2c5a8a}.node.lock,.node.soon{background:transparent;border:1.5px dashed #cfc3ac;cursor:default}
.node .tx{display:flex;flex-direction:column;gap:2px;min-width:0}.node b{font-size:16px;font-weight:600}.node .tx>span{font-size:13px;color:#5a4e3c}.node.quiz .tx>span:nth-of-type(1){color:#2c5a8a;font-weight:500}
.node .go{background:#4f6b3a;color:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;flex:none}
.node .fmt{align-self:flex-start;font-size:11px!important;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#5a4e3c;background:#ece5d6;border-radius:999px;padding:1px 8px}
.node .bst3{color:#e0a000!important;font-weight:800;font-size:13px}.node .bst3 i{font-style:normal;color:#e3c985}
#play{display:none}#play.on{display:block}
.tray{position:fixed;left:0;right:0;bottom:0;padding:10px 10px max(12px,env(safe-area-inset-bottom));display:flex;gap:8px;overflow-x:auto;background:linear-gradient(transparent,rgba(46,42,36,.55) 30%);z-index:6}
.tray button{all:unset;cursor:pointer;flex:none;background:var(--surface);border:3px solid transparent;border-radius:16px;padding:8px 12px;font-weight:800;font-size:14px;text-align:center;min-width:86px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.tray button.sel{border-color:var(--terra);transform:translateY(-4px)}.tray button.done{opacity:.4;pointer-events:none}.tray button small{display:block;font-weight:600;font-size:11px;color:#5a4e3c}
.slot{position:fixed;transform:translate(-50%,-50%);min-width:38px;height:38px;border-radius:999px;border:3px dashed #fff;background:rgba(44,90,138,.6);color:#fff;font-weight:900;font-size:14px;display:none;align-items:center;justify-content:center;cursor:pointer;z-index:5;padding:0 8px;white-space:nowrap}
.tapz{position:fixed;top:0;bottom:0;width:50%;z-index:3;display:none}.tapz.l{left:0}.tapz.r{right:0}
.hud .back{pointer-events:auto;cursor:pointer;border:none;font:inherit}
</style></head>
<body>
<div id="map"><div class="top"><h1 id="mTitle">Missions<small id="mSub"></small></h1><button class="x" id="mute" aria-label="Sound"></button><button class="x" id="close" aria-label="Close"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div class="path" id="path"></div></div>
<div id="play">
<canvas id="c" aria-label="3D mission"></canvas>
<div class="tapz l" id="tl"></div><div class="tapz r" id="tr"></div>
<div class="hud"><button class="pill back" id="back">← Map</button><span class="pill" id="hTitle"></span><span class="pill" id="hCnt"></span></div>
<div class="mission" id="mission"></div>
<div class="arrow" id="arrow" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2c5a8a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg></div>
<div class="hint" id="hint"></div>
<div class="joy" id="joy"><i id="knob"></i></div>
<div id="slots"></div><div class="tray" id="tray" style="display:none"></div>
</div>
<div class="card" id="card" role="dialog" aria-modal="true"><div class="in"><span class="tag" id="cTag"></span><h2 class="cT"></h2><p class="cP"></p><div class="opts"></div><button class="go"></button></div></div>
<div class="err" id="err">This device can’t show 3D (WebGL).</div>
<script src="engine.js?v=1795450640"></script>
<script src="minis.js?v=1795600001"></script>
<script src="game.js?v=1795600001"></script>
</body></html>
