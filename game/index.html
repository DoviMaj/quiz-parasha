<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Journey through the Torah</title><link rel="stylesheet" href="games.css?v=1795450640">
<style>
#map{position:fixed;inset:0;overflow-y:auto;background:linear-gradient(#f3e6c8,#e9dcc4);z-index:10;-webkit-overflow-scrolling:touch}
#map .top{position:sticky;top:0;z-index:2;background:rgba(243,230,200,.96);padding:max(12px,env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
#map h1{font-size:20px;margin:0;flex:1;line-height:1.2}#map h1 small{display:block;font-size:13px;color:#5a4e3c;font-weight:600}
#map .x{all:unset;cursor:pointer;width:40px;height:40px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800}
.path{position:relative;max-width:460px;margin:0 auto;padding:20px 16px 60px}
.book{margin:26px 0 8px;text-align:center;font-weight:900;letter-spacing:.08em;text-transform:uppercase;font-size:13px;color:#b5562f}
.node{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:10px 14px;margin:8px 0;box-shadow:0 2px 8px rgba(60,40,10,.1);width:78%;position:relative}
.node:nth-of-type(odd){margin-left:auto}
.node .dot{width:46px;height:46px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:#fff;background:#b5562f}
.node.done .dot{background:#4f6b3a}.node.quiz .dot{background:#e0a000}.node.lock{opacity:.55;cursor:default}.node.lock .dot{background:#bfae8c}.node.soon .dot{background:#d9c39a}
.node.now{outline:3px solid #b5562f;outline-offset:2px}
.node b{display:block;font-size:16px}.node .bst3{display:block;color:#e0a000;font-weight:800;font-size:13px;margin-top:2px}.node .bst3 i{font-style:normal;color:#d9c9a8}.node span{font-size:13px;color:#5a4e3c}
.node .fmt{position:absolute;top:-8px;right:10px;background:#2e2a24;color:#fff;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:2px 8px}
.stats{display:flex;gap:8px;justify-content:center;margin:6px 0 0}.stats span{background:#fff;border-radius:999px;padding:6px 12px;font-weight:800;font-size:14px}
#play{display:none}#play.on{display:block}
.tray{position:fixed;left:0;right:0;bottom:0;padding:10px 10px max(12px,env(safe-area-inset-bottom));display:flex;gap:8px;overflow-x:auto;background:linear-gradient(transparent,rgba(46,42,36,.55) 30%);z-index:6}
.tray button{all:unset;cursor:pointer;flex:none;background:var(--surface);border:3px solid transparent;border-radius:16px;padding:8px 12px;font-weight:800;font-size:14px;text-align:center;min-width:86px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.tray button.sel{border-color:var(--terra);transform:translateY(-4px)}.tray button.done{opacity:.4;pointer-events:none}.tray button small{display:block;font-weight:600;font-size:11px;color:#5a4e3c}
.slot{position:fixed;transform:translate(-50%,-50%);min-width:38px;height:38px;border-radius:999px;border:3px dashed #fff;background:rgba(181,86,47,.6);color:#fff;font-weight:900;font-size:14px;display:none;align-items:center;justify-content:center;cursor:pointer;z-index:5;padding:0 8px;white-space:nowrap}
.tapz{position:fixed;top:0;bottom:0;width:50%;z-index:3;display:none}.tapz.l{left:0}.tapz.r{right:0}
.hud .back{pointer-events:auto;cursor:pointer;border:none;font:inherit}
</style></head>
<body>
<div id="map"><div class="top"><h1 id="mTitle">Journey through the Torah<small id="mSub"></small></h1><button class="x" id="mute" aria-label="Sound">🔊</button><button class="x" id="close" aria-label="Close">×</button></div><div class="path" id="path"></div></div>
<div id="play">
<canvas id="c" aria-label="3D mission"></canvas>
<div class="tapz l" id="tl"></div><div class="tapz r" id="tr"></div>
<div class="hud"><button class="pill back" id="back">← Map</button><span class="pill" id="hTitle"></span><span class="pill" id="hCnt"></span></div>
<div class="mission" id="mission"></div>
<div class="arrow" id="arrow" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#b5562f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg></div>
<div class="hint" id="hint"></div>
<div class="joy" id="joy"><i id="knob"></i></div>
<div id="slots"></div><div class="tray" id="tray" style="display:none"></div>
</div>
<div class="card" id="card" role="dialog" aria-modal="true"><div class="in"><span class="tag" id="cTag"></span><h2 class="cT"></h2><p class="cP"></p><div class="opts"></div><button class="go"></button></div></div>
<div class="err" id="err">This device can’t show 3D (WebGL).</div>
<script src="engine.js?v=1795450640"></script>
<script src="minis.js?v=1795450640"></script>
<script src="game.js?v=1795450640"></script>
</body></html>
