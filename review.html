 .thumb{width:160px}
}
@media (min-width:1700px){.hd,.wrap:not(.team){padding-inline:calc((100vw - 1600px)/2 + 24px)}}

async function realBackend() {
  const V = "https://www.gstatic.com/firebasejs/10.12.2/";
  const [a, f, au] = await Promise.all([import(V + "firebase-app.js"), import(V + "firebase-firestore.js"), import(V + "firebase-auth.js")]);
  const app = a.initializeApp(window.QUIZ_CFG.firebase), auth = au.getAuth(app), fs = f.getFirestore(app);
  const D = p => f.doc(fs, p), C = p => f.collection(fs, p);
  const snap = (ref, cb) => f.onSnapshot(ref, cb, e => console.warn("snapshot", e.code));
  const wrap = u => u ? { uid: u.uid, email: (u.email || "").toLowerCase(), name: u.displayName || u.email, anon: u.isAnonymous } : null;
  let emit = () => {};
  return {
    onAuth(cb) { emit = () => cb(wrap(auth.currentUser)); au.onAuthStateChanged(auth, emit); },
    async signIn() {
      const p = new au.GoogleAuthProvider(), u = auth.currentUser;
      try {
        if (u && u.isAnonymous) { try { await au.linkWithPopup(u, p); } catch (e) { if (e.code === "auth/credential-already-in-use") await au.signInWithCredential(auth, au.GoogleAuthProvider.credentialFromError(e)); else throw e; } }
        else await au.signInWithPopup(auth, p);
      } catch (e) { if (!/popup-closed|cancelled/.test(e.code || "")) console.warn(e); return; }
      await auth.currentUser.getIdToken(true); emit();
    },
    signOut() { return au.signOut(auth).then(emit); },
    async getRole(email) { try { const s = await f.getDoc(D("roles/" + email)); return s.exists() ? s.data() : null; } catch (e) { return null; } },
    watchDrafts: cb => snap(C("drafts"), s => cb(s.docs.map(d => d.data()))),
    watchDays: (id, cb) => snap(C(`drafts/${id}/days`), s => { const m = {}; s.docs.forEach(d => m[d.id] = d.data()); cb(m); }),
    watchThreads: (id, cb) => snap(C(`drafts/${id}/threads`), s => { const m = {}; s.docs.forEach(d => m[d.id] = d.data()); cb(m); }),
    watchMsgs: (id, key, cb) => snap(f.query(C(`drafts/${id}/threads/${key}/messages`), f.orderBy("at")), s => cb(s.docs.map(d => d.data()))),
    setMark(id, key, me, v) {
      const o = { marks: { [me.uid]: v }, names: { [me.uid]: me.name } };
      if (v === "change") o.reply = f.deleteField();
      return f.setDoc(D(`drafts/${id}/threads/${key}`), o, { merge: true });
    },
    addMsg(id, key, me, text, kind) {
      const at = Date.now(), b = f.writeBatch(fs), m = { uid: me.uid, name: me.name, text, at, by: "human" };
      if (kind) m.kind = kind;
      b.set(f.doc(C(`drafts/${id}/threads/${key}/messages`)), m);
      b.set(D(`drafts/${id}/threads/${key}`), { last: { by: "human", uid: me.uid, at } }, { merge: true });
      return b.commit();
    },
    approve: (id, me) => f.updateDoc(D("drafts/" + id), { status: "approved", approvedBy: me.email, approvedName: me.name, approvedAt: Date.now() }),
    watchRoles: cb => snap(C("roles"), s => cb(s.docs.map(d => ({ email: d.id, ...d.data() })))),
    putRole: (email, role, me) => f.setDoc(D("roles/" + email), { role, addedBy: me.email, at: Date.now() }),
    delRole: email => f.deleteDoc(D("roles/" + email)),
    setVerified: (id, key, me) => f.setDoc(D(`drafts/${id}/threads/${key}`), { verified: { by: me.uid, at: Date.now() } }, { merge: true }),
    setMarked: (id, uid, n) => f.updateDoc(D("drafts/" + id), { ["marked." + uid]: n }),
  };
}

 <button data-a="back" aria-label="${t("back")}" style="border:0;background:transparent;padding:0;min-height:44px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;text-align:start"><span class="sub" style="font-size:12px">${esc(((curDraft().name || {})[UI]) || S.id)} · ${t("draft")} ${curDraft().rev || 1}</span>
 <span class="row nw" style="gap:4px;font-size:17px;font-weight:600">${TX[UI].day[x.day - 1]} · ${t("stepQ", { p: pos + 1, m: all.length })} ${svg('<path d="M6 9l6 6 6-6"/>', 16)}</span></button>
 <div class="row nw" style="gap:6px">${themeBtn()}${isAdmin() ? `<button class="ic" data-a="team" aria-label="${t("team")}">${svg('<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M19 8v6M16 11h6"/>')}</button>` : ""}
 <button class="ic" data-a="final" aria-label="${t("approvalBtn")}">${svg('<path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/>')}<span class="badge">${Math.min(99, sm.c.open + sm.c.change + sm.c.wait)}${sm.c.open + sm.c.change + sm.c.wait > 99 ? "+" : ""}</span></button></div></div>
 <div class="ticks" aria-hidden="true" style="grid-template-columns:repeat(${all.filter(v => v.day === x.day && v.kind === x.kind).length},minmax(0,1fr))">${ticks}</div></header>`;
  const body = `<div class="wrap" style="padding-top:16px"><article data-key="${x.key}" style="display:flex;flex-direction:column;gap:14px">
 <div class="row" style="gap:8px"><span class="pill ${lcls}">${lvl}${sn ? " · " + esc(sn) : ""}</span><span class="pill ${s}" style="white-space:normal">${t({ open: "stOpen", ok: "stOk", change: "stChg", wait: "stWait" }[s])}</span>${langTabs()}</div>
 ${b.img}${b.q}<ol class="opts" style="gap:8px">${b.opts}</ol>
 <div class="chips"><button class="chip${S.xv ? " on" : ""}" data-a="xv" aria-pressed="${S.xv}">${t("verse")}</button><button class="chip" data-a="sheet" data-v="src">${t("expBtn")}</button></div>
 ${b.verse}${estWarn(x)}</article></div>`;
  const bar = `<div class="bar"><button data-a="prev" aria-label="${t("prev")}" ${pos <= 0 ? "disabled" : ""}>${arrow(false)}</button><button class="nx${mine ? " grn" : ""}" data-a="next" style="grid-column:span 2;font-weight:600">${t("next")} ${arrow(true)}</button>
 <button data-a="sheet" data-v="cm" aria-label="${t("comments")}: ${S.msgs.length}">${svg('<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>')}<span class="cn">${S.msgs.length}</span></button>
 <button class="mk chg${mine === "change" ? " on" : ""}" data-a="sheet" data-v="chg">${t("btnChg")}</button><button class="mk ok${mine === "ok" ? " on" : ""}" data-a="mark" data-v="ok">${t("btnOk")}${mine === "ok" ? " ✓" : ""}</button></div>`;
  return head + body + bar;
}

function listRow(x) {
  const tl = x.it.t[UI] || x.it.t.es;
  return `<button class="lrow" data-a="open" data-v="${x.key}"><span class="n">#${x.day}.${x.idx + 1}</span><span class="q" lang="${UI}">${esc(plain(tl.q))}</span>${pill(st(x.key))}</button>`;
}

/* ---------- sheets ---------- */
function sheetHtml() {
  const key = openKeyNow(), x = key && items().find(i => i.key === key);
  if (!S.sheet || !x) return "";
  if (S.sheet === "src") {
    return `<div class="ov" data-a="bd"><section class="dlg" role="dialog" aria-modal="true" aria-labelledby="sh" style="max-height:88%"><span class="grab"></span><div class="row nw" style="justify-content:space-between"><h2 id="sh" style="font-size:18px;font-family:Rubik,sans-serif;font-weight:600">${t("expBtn")}</h2><button class="ic" data-a="closesheet" aria-label="${t("close")}">${svg('<path d="M6 6l12 12M18 6L6 18"/>', 18)}</button></div>${sourceSheet(x)}</section></div>`;
  }
  if (S.sheet === "draw" && x.it.img) {
    return `<div class="ov" data-a="bd"><section class="dlg" role="dialog" aria-modal="true" aria-labelledby="sh" style="max-width:720px"><span class="grab"></span><div class="row nw" style="justify-content:space-between"><h2 id="sh" style="font-size:18px;font-family:Rubik,sans-serif;font-weight:600">${t("draw")}</h2><button class="ic" data-a="closesheet" aria-label="${t("close")}">${svg('<path d="M6 6l12 12M18 6L6 18"/>', 18)}</button></div><img class="kimg" alt="${t("draw")}" src="${drawSrc(x.it)}"></section></div>`;
  }
  if (S.sheet === "cm") {
    return `<div class="ov" data-a="bd"><section class="dlg" role="dialog" aria-modal="true" aria-labelledby="sh"><span class="grab"></span><div class="row nw" style="justify-content:space-between"><h2 id="sh" style="font-size:18px;font-family:Rubik,sans-serif;font-weight:600">${t("comments")} (${S.msgs.length})</h2><button class="ic" data-a="closesheet" aria-label="${t("close")}">${svg('<path d="M6 6l12 12M18 6L6 18"/>', 18)}</button></div>
 <div style="display:flex;flex-direction:column;gap:12px;overflow:auto">${thread()}${confirmBtn(key)}</div>
 <label class="l">${t("cmSend")}<textarea class="f hot" id="cm" rows="3" placeholder="${t("cmPh")}">${esc(S.cm)}</textarea></label>
 <button class="btn ter" data-a="send" style="min-height:52px;justify-content:center">${t("cmSend")}</button></section></div>`;
  }
  const kinds = ["hint", "fact", "lang", "typo", "other"].map(k => `<button class="chip${S.kind === k ? " on" : ""}" data-a="kind" data-v="${k}" aria-pressed="${S.kind === k}">${t("k_" + k)}</button>`).join("");
  const can = S.chgText.trim().length > 0;
  return `<div class="ov" data-a="bd"><section class="dlg full" role="dialog" aria-modal="true" aria-labelledby="sh"><div class="row nw" style="justify-content:space-between"><button class="btn mob" data-a="closesheet" style="border:0;background:transparent;padding:0 6px">‹ ${t("bk")}</button><h2 id="sh" style="font-size:20px;flex:1;text-align:center">${t("chgT")}</h2><button class="ic" data-a="closesheet" aria-label="${t("close")}">${svg('<path d="M6 6l12 12M18 6L6 18"/>', 18)}</button></div>
 <span class="sub" style="font-weight:600">#${x.day}.${x.idx + 1} · ${esc(plain((x.it.t[UI] || x.it.t.es).q)).slice(0, 90)}…</span>
 <div style="display:flex;flex-direction:column;gap:6px"><span style="font-size:14px;color:var(--mut)">${t("chgK")}</span><div class="chips">${kinds}</div></div>
 <label class="l" style="font-size:14px">${t("chgW")}<textarea class="f hot" id="chg" rows="5" placeholder="${t("chgPh")}">${esc(S.chgText)}</textarea></label>
 ${can ? "" : `<span class="sub">${t("chgNeed")}</span>`}
 <button class="btn" data-a="sendchg" ${can ? "" : "disabled"} style="min-height:52px;justify-content:center;${can ? "background:var(--ter);border-color:var(--ter);color:#fff" : ""}">${t("chgSend")}</button></section></div>`;
}

/* ---------- screens ---------- */
const ICON = `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>`;
const langSw = full => `<div class="seg"${full ? ' style="width:100%"' : ""}>${[["es", "ES"], ["en", "EN"], ["he", "עב"]].map(([c, l]) => `<button data-a="ui" data-v="${c}" aria-selected="${UI === c}">${l}</button>`).join("")}</div>`;

function render() {
  const f = document.activeElement, fid = f && f.id, sel = f && f.selectionStart;
  document.documentElement.lang = UI; document.documentElement.dir = UI === "he" ? "rtl" : "ltr";
  document.getElementById("app").innerHTML = view();
  if (S.sc) { S.sc = false; const a = document.querySelector("article[data-key]"); if (a && isDesk()) a.scrollIntoView({ block: "start" }); }
  if (fid) { const e = document.getElementById(fid); if (e) { e.focus(); try { e.setSelectionRange(sel, sel); } catch (x) {} } }
}

function view() {
  if (!S.user || S.user.anon) return `<div class="center"><div class="box"><span class="logo" style="width:52px;height:52px;border-radius:14px">${ICON}</span><h1>${t("signT")}</h1><p>${t("signS")}</p><button class="btn dark" data-a="signin" style="min-height:52px;width:100%;justify-content:center">G · ${t("signB")}</button>${langSw(true)}${themeBtn()}</div></div>`;
  if (!S.roleLoaded) return `<div class="center"><p class="sub">${t("loading")}</p></div>`;
  if (!S.role) return `<div class="center"><div class="box"><h1>${t("noroleT")}</h1><p>${t("noroleS")}</p><b dir="ltr" style="word-break:break-all">${esc(S.user.email)}</b><button class="btn" data-a="signout">${t("out")}</button>${langSw(true)}${themeBtn()}</div></div>`;
  if (S.team && isAdmin()) return teamHtml();
  const sm = summary(), d = curDraft();
  let body = "", head = headerHtml(sm, d);
  if (!d) body = `<div class="wrap"><p class="dash" style="width:100%">${S.drafts.length ? t("loading") : t("noDraft")}</p></div>`;
  else {
    const key = openKeyNow(), cx = key && sm.all.find(x => x.key === key);
    if (cx && key !== S.synced) { S.synced = key; S.open = key; S.day = cx.day; S.sec = cx.kind; try { localStorage.setItem("review-pos-" + S.id, key); } catch (e) {} }
    const vis = visible(sm);
    ensureMsgs(key);
    if (!isDesk() && S.done) body = `<div class="wrap">${doneHtml()}</div>`;
    else if (!isDesk() && cx && !S.list) { head = ""; body = phoneItem(cx, sm.all.findIndex(x => x.key === key), sm.all); }
    else body = mainHtml(sm, d, vis, key, cx);
  }
  return head + body + (S.final && d ? finalHtml(sm, d) : "") + sheetHtml();
}

function headerHtml(sm, d) {
  const sel = `<select class="btn" data-a="draft" aria-label="${t("draft")}">${S.drafts.map(x => `<option value="${esc(x.id)}"${x.id === S.id ? " selected" : ""}>${esc((x.name && (x.name[UI] || x.name.es)) || x.id)} · ${t("draft")} ${x.rev || 1}</option>`).join("")}</select>`;
  const chips = Object.entries(sm.rv).map(([u, r]) => `<span class="row" style="gap:6px;font-size:12px;color:var(--mut)" title="${esc(r.n)}">${av(u, r.n, true)}${r.c}/${sm.total}</span>`).join("");
  return `<header class="hd"><div class="row"><span class="logo">${ICON}</span><div class="grow"><div class="ttl">${t("rev")}</div><div class="sub">${t("quiz")}</div></div>
 ${isAdmin() ? `<button class="btn" data-a="team">${t("team")}</button>` : ""}${langSw()}${themeBtn()}</div>
 <div class="row">${sel}<span class="sub grow">${t("deadline")}</span>${d ? `<button class="btn dark" data-a="final">${t("approvalBtn")} <span class="badge">${sm.c.open + sm.c.change + sm.c.wait}</span></button>` : ""}</div>
 ${chips ? `<div class="row" style="gap:12px">${chips}</div>` : ""}</header>`;
}

function mainHtml(sm, d, vis, key, cx) {
  const pct = n => (sm.total ? n / sm.total * 100 : 0).toFixed(1);
  const stats = [[sm.c.open, t("pend"), "var(--line2)"], [sm.c.ok, t("good"), "#4f6b3a"], [sm.c.change + sm.c.wait, `${t("chg")} · ${sm.c.wait} ${t("applied")}`, "#2c5a8a"], [sm.openc, t("openc"), "#6d28d9"]]
    .map(([n, l, c]) => `<div class="stat"><i style="background:${c}"></i><span><b>${n}</b><span>${l}</span></span></div>`).join("");
  const dayChip = n => { const x = sm.day[S.sec + n] || { ok: 0, n: 0 }; return { x, full: x.n && x.ok === x.n }; };
  const dayNames = n => TX[UI].day[n - 1];
  const dchips = [1, 2, 3, 4, 5, 6, 7].map(n => { const { x, full } = dayChip(n); return `<button class="chip${S.day === n ? " on" : full ? " full" : ""}" role="tab" aria-selected="${S.day === n}" data-a="day" data-v="${n}">${dayNames(n).slice(0, UI === "he" ? 9 : 3)} ${x.ok}/${x.n}</button>`; }).join("");
  const dside = [1, 2, 3, 4, 5, 6, 7].map(n => { const { x, full } = dayChip(n); return `<button class="dr${S.day === n ? " on" : ""}" data-a="day" data-v="${n}"><span style="flex:1"><b style="font-size:14px">${n} · ${dayNames(n)}</b><i><span style="width:${x.n ? Math.round(x.ok / x.n * 100) : 0}%;background:${full ? "#4f6b3a" : "#2c5a8a"}"></span></i></span><span class="sub">${x.ok}/${x.n}</span></button>`; }).join("");
  const secs = [["q", t("adults"), sm.kinds.q], ["k", t("kids"), sm.kinds.k]].filter(s => s[2]).map(([k, l, n]) => { const ok = sm.all.filter(x => x.kind === k && st(x.key) === "ok").length; return `<button class="chip${S.sec === k ? " on" : ""}" data-a="sec" data-v="${k}" style="min-height:44px">${l} <span style="font-size:12px;opacity:.8;margin-inline-start:6px">${ok}/${n}</span></button>`; }).join("");
  const flts = [["all", "all"], ["open", "fOpen"], ["change", "fChg"], ["ok", "fOk"], ...(sm.unv ? [["unv", "fUnv"]] : [])].map(([id, k]) => `<button class="chip${S.flt === id ? " on" : ""}" role="tab" aria-selected="${S.flt === id}" data-a="flt" data-v="${id}">${t(k)}</button>`).join("");
  const lvls = S.sec === "q" ? `<select class="btn" data-a="lvl" aria-label="${t("lvl")}">${[[0, "all"], [1, "easy"], [2, "med"], [3, "hard"]].map(([v, k]) => `<option value="${v}"${S.lvl === v ? " selected" : ""}>${t(k)}</option>`).join("")}</select>` : "";
  let list;
  if (!vis.length) list = `<p class="dash">${t("nothing")}</p>`;
  else list = vis.map(x => `<div class="card${x.key === key ? " cur" : ""}">${listRow(x)}</div>`).join("");
  const status = d.status === "approved" ? `<span class="pill ok">${t("approved", { n: esc(d.approvedName || d.approvedBy || "") })}</span>` : d.status === "published" ? `<span class="pill ok">${t("published")}</span>` : "";
  return `<div class="wrap">
 <div class="top"><div class="stats">${stats}</div><div class="prog" aria-hidden="true"><span style="width:${pct(sm.c.ok)}%;background:#4f6b3a"></span><span style="width:${pct(sm.c.change + sm.c.wait)}%;background:#2c5a8a"></span></div>
 <span class="sub">${t("revd", { a: sm.c.ok, b: sm.total, c: sm.kinds.q, d: sm.kinds.k })} ${status}</span></div>
 <nav class="side"><button class="btn ter mob" data-a="cont" style="justify-content:center">${t("cont")}</button><div class="chips"><h2 class="h2" style="flex:1 1 100%">${t("content")}</h2>${secs}</div>
  <div class="days m" role="tablist" aria-label="${t("days")}">${dchips}</div>
  <div class="dlist"><h2 class="h2" style="flex:1 1 100%;margin-bottom:4px">${t("days")}</h2>${dside}</div>
  <div class="chips" role="tablist">${flts}${lvls}</div><div class="lst">${list}</div></nav>
 ${isDesk() ? `<main class="mainc">${S.done ? doneHtml() : stepMain(cx, sm)}</main>` : ""}</div>`;
}

function finalHtml(sm, d) {
  const n1 = sm.c.open, n2 = sm.c.change + sm.c.wait, n3 = sm.openc;
  const rows = [[n1, "c1", "c1o", "c1b", "open"], [n2, "c2", "c2o", "c2b", "change"], [n3, "c3", "c3o", "c3b", "open"], [sm.unv, "c4", "c4o", "c4b", "unv"]].map(([n, a, b, c, flt]) => `<li><span class="m${n ? "" : " g"}">${n ? "!" : "✓"}</span><span style="flex:1"><b>${t(a)}</b><span class="s">${n ? t(c, { n }) : t(b)}</span></span>${n ? `<button class="btn" style="min-height:36px" data-a="see" data-v="${flt}">${t("see")}</button>` : ""}</li>`).join("");
  const miss = [n1, n2, n3, sm.unv].filter(Boolean).length, ready = !miss, pend = d.status === "review";
  const go = !pend ? `<span class="pill ok" style="align-self:flex-start">${d.status === "published" ? t("published") : t("approved", { n: esc(d.approvedName || d.approvedBy || "") })}</span>`
    : ready && canApprove() ? `<button class="btn grn" data-a="approve" style="min-height:54px;justify-content:center">${t("fGo")}</button><span class="sub" style="text-align:center">${t("fGoS")}</span>` : `<button class="btn" disabled style="min-height:54px;justify-content:center">${ready ? t("fOnly") : t("fMiss", { n: miss })}</button>`;
  return `<div class="ov" data-a="bd"><section class="dlg" role="dialog" aria-modal="true" aria-labelledby="ft" style="padding-top:20px"><div class="row nw" style="align-items:flex-start;justify-content:space-between"><div><span class="sub">${t("draft")} ${d.rev || 1} · ${sm.kinds.q} ${t("adults").toLowerCase()} · ${sm.kinds.k} ${t("kids").toLowerCase()}</span><h2 id="ft">${t("fT")} ${esc((d.name && (d.name[UI] || d.name.es)) || d.id)}</h2></div><button class="btn" data-a="closef" aria-label="${t("close")}" style="width:44px;padding:0;justify-content:center">✕</button></div>
 <ul class="chk">${rows}</ul>
 ${canApprove() ? "" : `<div class="sub">🔒 ${t("fOnly")}</div>`}
 <div class="row" style="flex-direction:column;align-items:stretch;gap:8px">${go}
 ${canApprove() && pend ? `<textarea class="f" id="note" rows="2" placeholder="${t("fNote")}">${esc(S.note)}</textarea><button class="btn ter" data-a="retnote" style="justify-content:center">${S.sent ? "✓ " + t("fSent") : t("fRet")}</button>` : ""}</div></section></div>`;
}

/* Revisores · invitar y roles (admins only; rules enforce it too) */
function teamHtml() {
  const me = S.user.email, rs = [...S.roles].sort((a, b) => (a.role === "admin" ? 0 : 1) - (b.role === "admin" ? 0 : 1) || a.email.localeCompare(b.email));
  const can = rs.filter(r => r.role !== "reviewer").length, valid = !badEmail(S.newEmail.trim());
  const help = { reviewer: "tHelpR", approver: "tHelpA", admin: "tHelpD" }[S.newRole];
  const people = rs.map(r => { const self = r.email === me;
    return `<div class="tp" dir="ltr"><span class="av" style="width:40px;height:40px;font-size:14px;background:${colr(r.email)}">${esc(ini(r.email))}</span>
 <span class="grow" style="display:flex;flex-direction:column;gap:2px"><span style="font-weight:600;overflow:hidden;text-overflow:ellipsis">${esc(r.email.split("@")[0])}</span><span class="sub" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.email)}${self ? " · " + t("tYou") : ""}</span></span>
 ${self ? `<span class="sub" style="font-weight:600">${t(r.role)}</span>` : `<select class="rolebtn" data-a="setrole" data-v="${esc(r.email)}" aria-label="${esc(r.email)}">${["admin", "approver", "reviewer"].map(x => `<option value="${x}"${r.role === x ? " selected" : ""}>${t(x)}</option>`).join("")}</select>
 <button class="btn ghost" data-a="copy" style="min-height:44px;font-size:13px">${S.copied === r.email ? t("tCopied") : t("tCopy")}</button>
 <button class="ic" data-a="delrole" data-v="${esc(r.email)}" aria-label="${t("tRem")} ${esc(r.email)}">${svg('<path d="M6 6l12 12M18 6L6 18"/>', 18)}</button>`}</div>`; }).join("");
  return `<header class="hd" style="flex-direction:row;align-items:center;gap:12px"><button class="ic" data-a="team" aria-label="${t("bk")}" style="border:1px solid var(--line);background:var(--card);border-radius:14px">${svg('<path d="M15 6l-6 6 6 6"/>', 20)}</button>
 <div class="grow" style="display:flex;flex-direction:column"><h1 class="ttl" style="margin:0;font-size:24px">${t("tT")}</h1><span class="sub">${t("tCount", { n: rs.length, m: can })}</span></div>${langSw()}</header>
 <div class="wrap team" style="padding-bottom:40px">
 <form class="card" data-a="inv" style="padding:14px;display:flex;flex-direction:column;gap:12px"><h2 style="margin:0;font-size:16px;font-weight:600">${t("tInv")}</h2>
  <label class="l">${t("tMail")}<input id="ne" type="email" dir="ltr" autocomplete="off" placeholder="name@gmail.com" value="${esc(S.newEmail)}" style="border:1.5px solid var(--line);border-radius:12px;background:var(--card);min-height:48px;padding:0 12px;font-size:16px;width:100%"></label>
  <div role="radiogroup" aria-label="${t("tRole")}" style="display:flex;flex-direction:column;gap:6px"><span style="font-size:13px;font-weight:600">${t("tRole")}</span>
   <div class="seg">${["reviewer", "approver", "admin"].map(x => `<button type="button" role="radio" data-a="nrole" data-v="${x}" aria-checked="${S.newRole === x}" style="min-height:44px;font-size:14px;padding:0 4px">${t(x)}</button>`).join("")}</div>
   <span class="sub" style="line-height:1.4">${t(help)}</span></div>
  ${S.err ? `<span class="sub" style="color:var(--terd)">${esc(S.err)}</span>` : ""}
  <button type="submit" class="btn" style="min-height:50px;justify-content:center;border:0;${valid ? "background:var(--grn);color:#fff" : "background:var(--line);color:var(--mut)"}">${t("tAdd")}</button></form>
 <div style="display:flex;flex-direction:column;gap:8px"><h2 class="h2">${t("tTeam")}</h2><div class="card">${people}</div></div>
 <p class="sub" style="margin:0 4px;line-height:1.5">${t("tFoot")}</p></div>`;
}

/* ---------- live data ---------- */
function ensureMsgs(key) {
  if (key === msgKey) return; msgKey = key; if (msgUnsub) { msgUnsub(); msgUnsub = null; } S.msgs = []; S.cm = "";
  if (key && S.id) msgUnsub = B.watchMsgs(S.id, key, m => { S.msgs = m; render(); });
}
/* keep drafts/{id}.marked.{uid} = how many items I have marked, so the quiz app can show "pending" cheaply */
function syncMarked() {
  const d = curDraft(); if (!d || !S.user) return;
  const n = Object.entries(S.th).filter(([k, th]) => k[0] !== "_" && th.marks && th.marks[S.user.uid]).length;
  if (((d.marked || {})[S.user.uid] || 0) !== n && S.lastSync !== n) { S.lastSync = n; B.setMarked(S.id, S.user.uid, n).catch(e => { S.lastSync = null; console.warn(e); }); }
}
function pickDraft(id) {
  unsubs.forEach(u => u()); unsubs = []; S.id = id; S.days = {}; S.th = {}; msgKey = null; S.open = null; S.synced = null; S.done = false; S.list = false;
  if (!id) return;
  unsubs.push(B.watchDays(id, m => { S.days = m; render(); }), B.watchThreads(id, m => { S.th = m; syncMarked(); render(); }));
}
async function onUser(u) {
  S.user = u; S.role = null; S.roleLoaded = false; render();
  if (!u || u.anon) return;
  S.role = await B.getRole(u.email); S.roleLoaded = true;
  if (S.role) {
    B.watchDrafts(ds => { S.drafts = ds.sort((a, b) => (b.shabbat || "").localeCompare(a.shabbat || "")); if (!S.id || !ds.some(x => x.id === S.id)) { const h = decodeURIComponent(location.hash.slice(1)); pickDraft((ds.find(x => x.id === h) || S.drafts[0] || {}).id); } render(); });
    if (S.role.role === "admin") B.watchRoles(r => { S.roles = r; render(); });
  }
  render();
}

/* ---------- events ---------- */
const go = fn => Promise.resolve().then(fn).catch(e => { console.warn(e); S.err = t("err"); render(); });
document.addEventListener("input", e => { const i = e.target.id; if (i === "cm") S.cm = e.target.value; else if (i === "note") S.note = e.target.value; else if (i === "ne") { S.newEmail = e.target.value; S.err = ""; } else if (i === "chg") { const was = S.chgText.trim().length > 0; S.chgText = e.target.value; if (was !== S.chgText.trim().length > 0) render(); } });
document.addEventListener("change", e => {
  const a = e.target.dataset.a;
  if (a === "draft") { pickDraft(e.target.value); render(); }
  else if (a === "lvl") { S.lvl = +e.target.value; jump(); render(); }
  else if (a === "setrole") go(() => B.putRole(e.target.dataset.v, e.target.value, S.user));
});
addEventListener("resize", () => render());
document.addEventListener("keydown", e => {
  if (e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey || e.shiftKey || (e.key !== "ArrowRight" && e.key !== "ArrowLeft")) return;
  const el = e.target; if (el && (/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName) || el.isContentEditable)) return;
  if (S.sheet || S.final || S.team || S.list || !S.id) return;
  e.preventDefault(); ((e.key === "ArrowRight") === (UI !== "he")) ? nextOpen() : step(-1); render();
});
document.addEventListener("submit", e => {
  e.preventDefault(); const em = S.newEmail.trim().toLowerCase();
  if (badEmail(em)) S.err = t("tBad"); else { S.err = ""; S.newEmail = ""; go(() => B.putRole(em, S.newRole, S.user)); }
  render();
});
let tx = null;
document.addEventListener("touchstart", e => { const a = e.target.closest(".bar,.ov") ? null : e.target.closest("article[data-key]"); tx = a && !isDesk() ? [e.touches[0].clientX, e.touches[0].clientY] : null; }, { passive: true });
document.addEventListener("touchend", e => {
  if (!tx) return; const dx = e.changedTouches[0].clientX - tx[0], dy = e.changedTouches[0].clientY - tx[1]; tx = null;
  if (Math.abs(dx) > 70 && Math.abs(dy) < 50) { const all = items(), i = all.findIndex(x => x.key === openKeyNow()), n = all[i + ((dx < 0) === (UI !== "he") ? 1 : -1)]; if (n) { setOpen(n.key); render(); } }
}, { passive: true });
document.addEventListener("click", e => {
  const b = e.target.closest("[data-a]"); if (!b || b.tagName === "SELECT" || b.tagName === "FORM") return;
  const a = b.dataset.a, v = b.dataset.v;
  if (a === "bd") { if (e.target !== b) return; S.sheet = null; S.final = false; render(); return; }
  if (a === "signin") go(() => B.signIn());
  else if (a === "signout") go(() => B.signOut());
  else if (a === "ui") { UI = v; S.cl = v; try { localStorage.setItem("review-lang", JSON.stringify(v)); } catch (x) {} }
  else if (a === "cl") S.cl = v;
  else if (a === "theme") { TH = isDark() ? "light" : "dark"; document.documentElement.dataset.theme = TH; try { localStorage.setItem("review-theme", TH); } catch (x) {} }
  else if (a === "sec") { S.sec = v; jump(); }
  else if (a === "day") { S.day = +v; jump(); }
  else if (a === "lvl") { S.lvl = +v; jump(); }
  else if (a === "flt") { S.flt = v; jump(); }
  else if (a === "open") setOpen(v);
  else if (a === "back") S.list = true;
  else if (a === "cont") S.list = false;
  else if (a === "next") nextOpen();
  else if (a === "prev") step(-1);
  else if (a === "again") S.done = false;
  else if (a === "xv") S.xv = !S.xv;
  else if (a === "xe") S.xe = !S.xe;
  else if (a === "full") S.full[v] = !S.full[v];
  else if (a === "team") S.team = !S.team;
  else if (a === "final") S.final = true;
  else if (a === "closef") S.final = false;
  else if (a === "see") { S.final = false; S.team = false; S.flt = v; jump(); }
  else if (a === "sheet") { S.sheet = v; if (v === "chg") { S.kind = null; S.chgText = ""; } }
  else if (a === "closesheet") S.sheet = null;
  else if (a === "kind") S.kind = v;
  else if (a === "mark") { const k = openKeyNow(); if (k) go(() => B.setMark(S.id, k, meObj(), v)); S.sheet = null; }
  else if (a === "verify") { const k = openKeyNow(); if (k) go(() => B.setVerified(S.id, k, meObj())); }
  else if (a === "send") { const k = openKeyNow(), txt = S.cm.trim(); if (k && txt) { S.cm = ""; go(() => B.addMsg(S.id, k, meObj(), txt)); } }
  else if (a === "sendchg") {
    const k = openKeyNow(), txt = S.chgText.trim(), kind = S.kind || "other";
    if (k && txt) { go(async () => { await B.setMark(S.id, k, meObj(), "change"); await B.addMsg(S.id, k, meObj(), txt, kind); }); S.sheet = null; S.chgText = ""; }
  }
  else if (a === "approve") go(async () => { await B.approve(S.id, meObj()); });
  else if (a === "retnote") { const txt = S.note.trim(); if (txt) go(async () => { await B.addMsg(S.id, "_general", meObj(), txt); S.note = ""; S.sent = true; render(); }); }
  else if (a === "nrole") S.newRole = v;
  else if (a === "copy") { const row = b.closest(".tp"); const em = row && row.querySelector(".sub").textContent.split(" ")[0]; try { navigator.clipboard.writeText(location.origin + location.pathname); } catch (x) {} S.copied = em; setTimeout(() => { S.copied = ""; render(); }, 1800); }
  else if (a === "delrole") { if (confirm(t("tAsk", { e: v }))) go(() => B.delRole(v)); }
  render();
});

/* ---------- boot ---------- */
(async () => {
  try {
    if (!MOCK && !(window.QUIZ_CFG && window.QUIZ_CFG.firebase)) throw new Error("no config");
    B = MOCK ? await mockBackend() : await realBackend();
    B.onAuth(onUser);
  } catch (e) { console.warn(e); document.getElementById("app").innerHTML = `<div class="center"><p class="sub">${esc(t("err"))}</p></div>`; }
})();
render();
</script>
</body>
</html>
